services:
  - type: web
    name: admin-crm-combined-server
    runtime: node
    rootDir: combined-server
    buildCommand: npm install && npm install --prefix ../marketing-crm/server && npm install --prefix ../sales-crm/backend
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false
      - key: SHELL_URL
        sync: false
